# =============================================================================
#  starship.toml — Catppuccin
#  Docs: https://starship.rs/config/
# =============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](red)\
$os\
$username\
$hostname\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$kubernetes\
$docker_context\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$helm\
$terraform\
$aws\
[](fg:green bg:lavender)\
$time\
[ ](fg:lavender)\
[](reset)\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_macchiato'

# =============================================================================
#  OS icon — Windows  Linux  macOS glyph (requires Nerd Font)
# =============================================================================

[os]
disabled = false
style    = "bg:red fg:crust"

[os.symbols]
Windows          = ""
Ubuntu           = "󰕈"
SUSE             = ""
Raspbian         = "󰐿"
Mint             = "󰣭"
Macos            = "󰀵"
Manjaro          = ""
Linux            = "󰌽"
Gentoo           = "󰣨"
Fedora           = "󰣛"
Alpine           = ""
Amazon           = ""
Android          = ""
AOSC             = ""
Arch             = "󰣇"
Artix            = "󰣇"
CentOS           = ""
Debian           = "󰣚"
Redhat           = "󱄛"
RedHatEnterprise = "󱄛"

# =============================================================================
#  Identity — only shows on SSH sessions
# =============================================================================

[username]
format      = '[ $user]($style)'
show_always = true
style_user  = "bg:red fg:crust"
style_root  = "bg:red fg:crust"

[hostname]
format   = "[@]($style)[$hostname]($style)"
ssh_only = true
style    = "bg:red fg:crust"

# =============================================================================
#  Directory
# =============================================================================

[directory]
format            = "[ $path ]($style)[$read_only]($style)"
home_symbol       = "󱂶 "
read_only         = "󰌾 "
style             = "bg:peach fg:crust"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Developer" = "󱂀 "
"Documents" = "󱧷 "
"Downloads" = "󱃩 "
"Music"     = "󱍚 "
"Pictures"  = "󱞋 "
"Projects"  = "󱞋 "

# =============================================================================
#  Git
# =============================================================================

[git_branch]
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'
style  = "bg:yellow"
symbol = ""

[git_status]
ahead      = ' ahead=${count}'
behind     = ' behind=${count}'
conflicted = '[ conflicted=${count}](fg:crust bg:yellow) '
deleted    = '[󰍶 deleted=${count}](fg:crust bg:yellow) '
diverged   = ' ahead=${ahead_count}  behind=${behind_count}'
format     = '[[\( ($all_status$ahead_behind\))](fg:crust bg:yellow)]($style)'
modified   = '[󰛿 modified=${count}](fg:crust bg:yellow) '
renamed    = '[󱍸 renamed=${count}](fg:crust bg:yellow) '
staged     = '[󰐗 staged=${count}](fg:crust bg:yellow) '
stashed    = '[ stashed=${count}](fg:crust bg:yellow) '
style      = "bg:yellow"
up_to_date = '[󰘽 up-to-date](fg:crust bg:yellow) '
untracked  = '[󰋗 untracked=${count}](fg:crust bg:yellow) '

# =============================================================================
#  Kubernetes
# =============================================================================

[kubernetes]
disabled          = false
detect_files      = ["*.yaml", "*.yml", "helmfile.yaml", "kustomization.yaml",
                     "Chart.yaml", ".helmignore"]
detect_folders    = [".kube", "k8s", "kubernetes", "helm", "charts", "manifests"]
format            = '[[ $symbol$context( \($namespace\)) ](fg:crust bg:green)]($style)'
style             = "bg:green"
symbol            = "󱃾 "

[kubernetes.context_aliases]
".*dev.*"     = " dev"
".*prod.*"    = " prod"
".*staging.*" = " stg"

[helm]
detect_files   = ["helmfile.yaml", "Chart.yaml", "Chart.lock"]
detect_folders = ["charts"]
format         = "[ $symbol$version]($style) "
style          = "bg:green"
symbol         = "⎈ "

# =============================================================================
#  Docker
# =============================================================================

[docker_context]
format          = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'
only_with_files = true
style           = "bg:sapphire"
symbol          = ""

# =============================================================================
#  Terraform
# =============================================================================

[terraform]
format = '[[ $symbol$workspace ](fg:crust bg:green)]($style)'
style  = "bg:green"
symbol = "󱁢 "

# =============================================================================
#  AWS
# =============================================================================

[aws]
force_display = false
format        = "[[ $symbol$profile(\\($region\\))](fg:crust bg:green)]($style) "
style         = "bg:green"
symbol        = " "

# =============================================================================
#  Languages
# =============================================================================

[nodejs]
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]
detect_files      = ["package.json", ".nvmrc", ".node-version"]
detect_folders    = ["node_modules"]
format            = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
style             = "bg:green"
symbol            = ""

[bun]
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
style  = "bg:green"
symbol = ""

[c]
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
style  = "bg:green"
symbol = " "

[rust]
detect_extensions = ["rs"]
detect_files      = ["Cargo.toml", "Cargo.lock"]
format            = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
style             = "bg:green"
symbol            = ""

[golang]
detect_extensions = ["go"]
detect_files      = ["go.mod", "go.sum", "go.work"]
format            = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
style             = "bg:green"
symbol            = ""

[php]
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
style  = "bg:green"
symbol = ""

[java]
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
style  = "bg:green"
symbol = " "

[kotlin]
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
style  = "bg:green"
symbol = ""

[haskell]
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
style  = "bg:green"
symbol = ""

[python]
pyenv_version_name = true
detect_extensions  = ["py"]
detect_files       = [".python-version", "requirements.txt", "pyproject.toml",
                      "setup.py", "setup.cfg", "Pipfile", "tox.ini"]
detect_folders     = [".venv", "venv", ".tox"]
format             = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'
style              = "bg:green"
symbol             = ""

# =============================================================================
#  Additonal settings
# =============================================================================

[time]
disabled    = false
format      = '[[  $time ](fg:crust bg:lavender)]($style)'
style       = "bg:lavender"
time_format = "%R"

[line_break]
disabled = false

[character]
disabled = false
error_symbol = '[❯](bold fg:red)'
success_symbol = '[❯](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
disabled = false
format = " in $duration "
min_time_to_notify = 45000
show_milliseconds = true
show_notifications = true
style = "bg:lavender"

# =============================================================================
#  Catppuccin Macchiato palette (the only flavour)
# =============================================================================

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"
