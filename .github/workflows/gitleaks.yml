name: gitleaks
on:
  push:
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x scripts/*.sh .githooks/pre-commit bootstrap/bootstrap.sh tests/zsh/*.sh
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Pester (real pwsh, throwaway HOME)
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/powershell'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = Join-Path $env:RUNNER_TEMP 'testResults.xml'
          Invoke-Pester -Configuration $cfg
  zsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run zsh sandbox harness (real zsh, throwaway HOME, fake apt/curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh jq
          bash tests/zsh/run.sh
